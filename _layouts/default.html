<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }} — {{ site.description }}{% endif %}</title>
    <meta name="description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">
    <link rel="canonical" href="{{ page.url | replace:'index.html','' | prepend: site.baseurl | prepend: site.url }}">
    <link rel="icon" href="{{ '/favicon.ico' | prepend: site.baseurl }}">

    <!-- Open Graph / Twitter -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}">
    <meta property="og:description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">
    <meta property="og:url" content="{{ page.url | replace:'index.html','' | prepend: site.baseurl | prepend: site.url }}">
    <meta name="twitter:card" content="summary_large_image">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Silkscreen:wght@400;700&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | prepend: site.baseurl }}">
</head>
<body>

    <nav class="site-nav">
        <div class="container nav-inner">
            <a class="nav-brand" href="{{ '/' | prepend: site.baseurl }}">
                <span class="neon-shimmer">Kurage Studios</span>
            </a>
            <ul class="nav-links">
                <li><a href="{{ '/' | prepend: site.baseurl }}#games">Games</a></li>
                <li><a href="{{ '/' | prepend: site.baseurl }}#about">About</a></li>
                <li><a href="{{ '/' | prepend: site.baseurl }}#links">Links</a></li>
            </ul>
        </div>
    </nav>

    <main>
        {{ content }}
    </main>

    <footer class="site-footer">
        <div class="container footer-inner">
            <p class="footer-copy">&copy; {{ site.time | date: '%Y' }} {{ site.title }} · {% for line in site.address %}{{ line.line }}{% endfor %}</p>
            <ul class="footer-socials">
                {% for social in site.socials %}
                <li><a href="{{ social.url }}" target="_blank" rel="noopener">{{ social.title }}</a></li>
                {% endfor %}
                <li><a href="mailto:{{ site.email }}">Email</a></li>
                <li><a href="{{ '/feed.xml' | prepend: site.baseurl }}">RSS</a></li>
            </ul>
        </div>
    </footer>

</body>
</html>
